/**
 * 특정 실천 분야의 3단계 위계 노드 목록 조회
 * @param {string} domainId - 예: '01_사회복지관', '02_노인복지'
 * @returns {Array} 해당 분야의 노드 배열
 */
function getHierarchyByDomain(domainId) {
  if (!domainId) return WELFARE_HIERARCHY_NODES;
  return WELFARE_HIERARCHY_NODES.filter(n => n.domainId === domainId);
}

/**
 * 실천 분야의 플랫 노드를 계층형 트리 객체로 변환
 * Structure: { [level1]: { [level2]: [ level3_nodes ] } }
 * @param {string} domainId
 * @returns {Object} 중첩된 계층 트리
 */
function getHierarchyTree(domainId) {
  const nodes = getHierarchyByDomain(domainId);
  const tree = {};

  nodes.forEach(node => {
    const l1 = node.level1;
    const l2 = node.level2;

    if (!tree[l1]) {
      tree[l1] = {};
    }
    if (!tree[l1][l2]) {
      tree[l1][l2] = [];
    }
    tree[l1][l2].push(node);
  });

  return tree;
}

/**
 * 전체 12대 분야를 포괄하는 종합 트리 맵 생성
 * Structure: { [domainId]: { info: domainInfo, tree: { [level1]: { [level2]: [ nodes ] } } } }
 */
function getFullHierarchyTreeMap() {
  const fullMap = {};
  WELFARE_HIERARCHY_DOMAINS.forEach(dom => {
    fullMap[dom.id] = {
      info: dom,
      tree: getHierarchyTree(dom.id),
      totalServices: getHierarchyByDomain(dom.id).length
    };
  });
  return fullMap;
}

/**
 * 키워드 기반 소분류/중분류/대분류/설명 실시간 검색
 * @param {string} query - 검색어
 * @returns {Array} 매칭된 노드 목록
 */
function searchHierarchyNodes(query) {
  if (!query || typeof query !== 'string') return [];
  const q = query.trim().toLowerCase();
  
  return WELFARE_HIERARCHY_NODES.filter(n => {
    return (
      (n.level3 && n.level3.toLowerCase().includes(q)) ||
      (n.level2 && n.level2.toLowerCase().includes(q)) ||
      (n.level1 && n.level1.toLowerCase().includes(q)) ||
      (n.facilityType && n.facilityType.toLowerCase().includes(q)) ||
      (n.summary && n.summary.toLowerCase().includes(q)) ||
      (n.guidelineRef && n.guidelineRef.file && n.guidelineRef.file.toLowerCase().includes(q))
    );
  });
}

/**
 * 데이터베이스 통계 반환
 */
function getHierarchyStats() {
  const totalNodes = WELFARE_HIERARCHY_NODES.length;
  const totalDomains = WELFARE_HIERARCHY_DOMAINS.length;
  const facilities = new Set(WELFARE_HIERARCHY_NODES.map(n => n.facilityType));
  const files = new Set(WELFARE_HIERARCHY_NODES.map(n => n.guidelineRef.file));
  
  return {
    totalDomains,
    totalNodes,
    uniqueFacilitiesCount: facilities.size,
    uniqueGuidelinesCount: files.size
  };
}

    window.getHierarchyByDomain = getHierarchyByDomain;
    window.getHierarchyTree = getHierarchyTree;
    window.getFullHierarchyTreeMap = getFullHierarchyTreeMap;
    window.searchHierarchyNodes = searchHierarchyNodes;
    window.getHierarchyStats = getHierarchyStats;
}

if (typeof module !== 'undefined' && module.exports) {

    };
}

(function () {

                            <div class="flex items-center gap-2">
                                <span class="w-2 h-2 rounded-full bg-teal-400"></span>

                            </div>
                        </div>

                            ※ 보건복지부·여성가족부·교육부 2026/2027 최신 발행본 준용
                        </div>
                    </div>
                </div>

                <!-- 2. 실시간 검색 & 컨트롤 바 -->
                <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm space-y-4">
                    <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">

                                </svg>
                            </div>
                            <input 
                                type="text" 
                                id="hierarchy-search-input" 
                                value="${escapeHtml(hierarchySearchQuery)}"
                                placeholder="단위 서비스, 중분류, 지침서명, 시설명 검색 (예: 급식, 사례관리, 1388, 치매, 보호작업장, 드림스타트...)" 
                                class="w-full pl-10 pr-10 py-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-medium focus:bg-white focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition outline-none"
                                oninput="handleHierarchySearch(this.value)"
                            />
                            ${hierarchySearchQuery ? `

                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                                </svg>

                            </button>
                            <button type="button" onclick="toggleAllHierarchyLevels(true)" class="px-3.5 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 cursor-pointer">
                                <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
                                </svg>
                                <span>모두 접기</span>
                            </button>
                        </div>
                    </div>

                        </button>
                        ${domains.map(dom => {
                            const domNodes = nodes.filter(n => n.domainId === dom.id);
                            const isActive = currentDomainId === dom.id;
                            return `
                                <button 
                                    type="button" 
                                    onclick="selectHierarchyDomain('${dom.id}')" 
                                    class="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 flex-shrink-0 cursor-pointer ${isActive ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'}"
                                    title="${escapeHtml(dom.description)}"
                                >
                                    <span>${dom.icon}</span>
                                    <span>${dom.name.split('·')[0].trim()}</span>
                                    <span class="px-1.5 py-0.2 rounded-full text-[10px] ${isActive ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'} font-num">${domNodes.length}</span>

                    </div>

                <!-- 3. 계층형 트리 렌더링 영역 -->
                <div id="hierarchy-tree-content" class="space-y-6">
                    ${renderTreeContent()}
                </div>

            </div>
        `;
    }

    // 트리 본문 렌더링
    function renderTreeContent() {
        const { domains, nodes } = getDB();

        // 1. 검색어 필터링
        let targetNodes = nodes;
        if (hierarchySearchQuery.trim()) {
            const q = hierarchySearchQuery.trim().toLowerCase();
            targetNodes = nodes.filter(n => 
                (n.level3 && n.level3.toLowerCase().includes(q)) ||
                (n.level2 && n.level2.toLowerCase().includes(q)) ||
                (n.level1 && n.level1.toLowerCase().includes(q)) ||
                (n.facilityType && n.facilityType.toLowerCase().includes(q)) ||
                (n.summary && n.summary.toLowerCase().includes(q)) ||
                (n.guidelineRef && n.guidelineRef.file && n.guidelineRef.file.toLowerCase().includes(q))
            );
        }

        // 2. 도메인 필터링
        let targetDomains = domains;
        if (currentDomainId !== 'all') {
            targetDomains = domains.filter(d => d.id === currentDomainId);
        }

        // 검색 결과가 없는 경우
        if (targetNodes.length === 0) {
            return `
                <div class="bg-white rounded-3xl p-12 text-center border border-slate-200/80 shadow-sm max-w-xl mx-auto space-y-4">
                    <div class="w-16 h-16 rounded-full bg-slate-100 text-3xl flex items-center justify-center mx-auto text-slate-400">
                        🔍
                    </div>
                    <div class="space-y-1">
                        <h3 class="text-base font-bold text-slate-800">검색된 단위 서비스가 없습니다</h3>
                        <p class="text-xs text-slate-500">"${escapeHtml(hierarchySearchQuery)}"에 일치하는 대·중·소분류 또는 지침서가 없습니다.</p>
                    </div>
                    <div class="pt-2 flex justify-center">
                        <button type="button" onclick="clearHierarchySearch()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700 transition">
                            검색어 초기화
                        </button>
                    </div>
                </div>
            `;
        }

        // 도메인별 렌더링
        return targetDomains.map(dom => {
            const domNodes = targetNodes.filter(n => n.domainId === dom.id);
            if (domNodes.length === 0) return ''; // 해당 도메인에 매칭 노드가 없으면 건너뜀

            // 중첩 트리 생성: { [level1]: { [level2]: [nodes] } }
            const tree = {};
            domNodes.forEach(node => {
                const l1 = node.level1;
                const l2 = node.level2;
                if (!tree[l1]) tree[l1] = {};
                if (!tree[l1][l2]) tree[l1][l2] = [];
                tree[l1][l2].push(node);
            });

            return `
                <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm overflow-hidden transition-all">
                    
                    <!-- 분야 헤더 (카드 최상단) -->

                        <div class="flex items-start gap-4">
                            <span class="text-3xl p-2.5 rounded-2xl bg-white border border-slate-200/80 shadow-xs flex-shrink-0">${dom.icon}</span>
                            <div class="space-y-1">
                                <div class="flex items-center gap-2.5 flex-wrap">
                                    <h2 class="text-lg sm:text-xl font-black text-slate-900">${dom.name}</h2>
                                    <span class="px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold font-num">
                                        ${domNodes.length}개 서비스
                                    </span>
                                </div>
                                <p class="text-xs sm:text-sm text-slate-500 leading-relaxed">${dom.description}</p>
                            </div>
                        </div>

                        <!-- 관련 법정 시설 태그 리스트 -->
                        <div class="flex flex-wrap items-center gap-1.5 md:justify-end max-w-md">
                            ${dom.facilityTypes.map(f => `
                                <span class="px-2 py-0.5 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-semibold border border-slate-200/60">
                                    ${f}
                                </span>
                            `).join('')}
                        </div>
                    </div>

                    <!-- 3단계 트리 본문 (Level 1 -> Level 2 -> Level 3) -->
                    <div class="p-4 sm:p-6 space-y-5 bg-slate-50/40">
                        ${Object.keys(tree).map(level1 => {
                            const level1Id = `${dom.id}-${level1}`;
                            const isCollapsed = collapsedL1Categories.has(level1Id);
                            const l2Dict = tree[level1];
                            const l1TotalCount = Object.values(l2Dict).reduce((sum, list) => sum + list.length, 0);

                            return `
                                <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden transition">
                                    
                                    <!-- Level 1: [대분류 (법정 기능 / 정책 대사업)] 아코디언 헤더 -->
                                    <button 
                                        type="button" 
                                        onclick="toggleHierarchyL1('${escapeHtml(level1Id)}')"
                                        class="w-full px-5 py-3.5 bg-slate-100/70 hover:bg-slate-100 transition flex items-center justify-between text-left cursor-pointer border-b border-slate-200/60"
                                    >
                                        <div class="flex items-center gap-2.5 flex-wrap">
                                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span>
                                            <span class="text-xs uppercase tracking-wider font-extrabold text-emerald-800 bg-emerald-50 border border-emerald-200/80 px-2 py-0.5 rounded-md">대분류</span>
                                            <span class="text-sm sm:text-base font-black text-slate-900">${level1}</span>
                                            <span class="text-xs font-bold text-slate-400 font-num">(${l1TotalCount}개 세부서비스)</span>
                                        </div>
                                        <div class="text-slate-400 transition-transform duration-200 ${isCollapsed ? '' : 'rotate-180'}">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                            </svg>
                                        </div>
                                    </button>

                                    <!-- Level 2 & Level 3 컨테이너 -->
                                    ${!isCollapsed ? `
                                        <div class="p-4 sm:p-5 space-y-6">
                                            ${Object.keys(l2Dict).map(level2 => {
                                                const serviceList = l2Dict[level2];
                                                return `
                                                    <div class="space-y-3">
                                                        
                                                        <!-- Level 2: [중분류 (핵심 사업군)] 헤더 -->
                                                        <div class="flex items-center gap-2 pl-1 border-l-3 border-teal-500">
                                                            <span class="text-[11px] font-bold text-teal-800 bg-teal-50 border border-teal-200/80 px-1.5 py-0.2 rounded">중분류</span>
                                                            <h3 class="text-xs sm:text-sm font-bold text-slate-800">${level2}</h3>
                                                            <span class="text-[11px] text-slate-400 font-num">(${serviceList.length})</span>
                                                        </div>

                                                        <!-- Level 3: [소분류 (단위 서비스 / 세부 프로그램)] 카드 그리드 -->
                                                        <div class="grid grid-cols-1 gap-3 pl-3 sm:pl-4">
                                                            ${serviceList.map(node => renderServiceCard(node)).join('')}
                                                        </div>

                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    ` : ''}

                                </div>
                            `;
                        }).join('')}
                    </div>

                </div>
            `;
        }).join('');
    }

    // 소분류 단위 서비스 카드 렌더링
    function renderServiceCard(node) {
        return `
            <div class="bg-slate-50/80 hover:bg-white p-4 rounded-xl border border-slate-200/70 hover:border-emerald-300 hover:shadow-md transition space-y-3">

                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div class="flex items-center gap-2 flex-wrap">
                        <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                        <span class="text-xs font-extrabold text-slate-800">${node.level3}</span>
                    </div>
                    <span class="self-start sm:self-auto px-2 py-0.5 rounded-md bg-white border border-slate-200 text-slate-600 text-[11px] font-bold shadow-2xs">
                        🏛️ ${node.facilityType}
                    </span>

                <!-- 서비스 요약 정의 -->
                <p class="text-xs sm:text-sm text-slate-600 leading-relaxed pl-3.5 border-l-2 border-slate-200">

                <!-- 공식 지침서 원문 출처 박스 (Efficiency_DB 매칭) -->
                <div class="bg-white/90 p-3 rounded-lg border border-slate-200/60 text-xs space-y-1.5 text-slate-600">
                    <div class="flex items-start gap-2">
                        <span class="text-slate-400 font-semibold flex-shrink-0">📑 공식 지침서:</span>
                        <span class="font-bold text-slate-800 break-all select-all">${node.guidelineRef.file}</span>
                    </div>
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-slate-500">
                        <div><strong class="text-slate-700">📍 페이지:</strong> <span class="text-emerald-700 font-bold font-num bg-emerald-50 px-1.5 py-0.2 rounded">${node.guidelineRef.page}</span></div>
                        <div><strong class="text-slate-700">🔖 근거 조항/장절:</strong> ${node.guidelineRef.chapter}</div>
                    </div>
                    
                    <!-- 아카이브 이동 바로가기 링크 버튼 -->
                    <div class="pt-1 flex justify-end">
                        <button 
                            type="button" 
                            onclick="goToArchiveSearch('${escapeHtml(node.guidelineRef.file)}')"
                            class="inline-flex items-center gap-1 text-[11px] font-bold text-blue-600 hover:text-blue-800 hover:underline cursor-pointer"
                        >
                            <span>지침서 아카이브에서 보기</span>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </button>
                    </div>
                </div>

            </div>
        `;
    }

    // 도메인 필터 선택
    window.selectHierarchyDomain = function (domainId) {
        currentDomainId = domainId;
        const container = document.getElementById('view-hierarchy');
        if (container) renderLayout(container);
    };

    // 실시간 검색
    window.handleHierarchySearch = function (query) {
        hierarchySearchQuery = query;
        const treeContainer = document.getElementById('hierarchy-tree-content');
        if (treeContainer) {
            treeContainer.innerHTML = renderTreeContent();
        }
    };

    // 검색어 초기화
    window.clearHierarchySearch = function () {
        hierarchySearchQuery = '';
        const input = document.getElementById('hierarchy-search-input');
        if (input) input.value = '';
        const container = document.getElementById('view-hierarchy');
        if (container) renderLayout(container);
    };

    // Level 1 아코디언 토글
    window.toggleHierarchyL1 = function (level1Id) {
        if (collapsedL1Categories.has(level1Id)) {
            collapsedL1Categories.delete(level1Id);
        } else {
            collapsedL1Categories.add(level1Id);
        }
        const treeContainer = document.getElementById('hierarchy-tree-content');
        if (treeContainer) {
            treeContainer.innerHTML = renderTreeContent();
        }
    };

    // 전체 펼치기 / 전체 접기
    window.toggleAllHierarchyLevels = function (collapseAll) {
        const { domains, nodes } = getDB();
        if (collapseAll) {
            domains.forEach(d => {
                const domNodes = nodes.filter(n => n.domainId === d.id);
                domNodes.forEach(n => {
                    collapsedL1Categories.add(`${d.id}-${n.level1}`);
                });
            });
        } else {
            collapsedL1Categories.clear();
        }
        const treeContainer = document.getElementById('hierarchy-tree-content');
        if (treeContainer) {
            treeContainer.innerHTML = renderTreeContent();
        }
    };

    // 지침서 아카이브로 즉시 이동
    window.goToArchiveSearch = function (filename) {
        if (typeof window.showView === 'function') {
            window.showView('archive');
            setTimeout(() => {
                const input = document.getElementById('archive-search-input');
                if (input && typeof window.handleArchiveSearch === 'function') {
                    input.value = filename;
                    window.handleArchiveSearch(filename);
                }
            }, 100);
        }
    };

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

})();

    for (const cat of db) {
        const matchingSources = [];
        for (const src of cat.sources) {
            const matchingFiles = src.files.filter(f => 
                f.title.toLowerCase().includes(q) ||
                f.filename.toLowerCase().includes(q) ||
                f.ministry.toLowerCase().includes(q) ||
                src.sourceName.toLowerCase().includes(q) ||
                cat.categoryName.toLowerCase().includes(q)
            );
            if (matchingFiles.length > 0) {
                matchingSources.push({
                    ...src,
                    fileCount: matchingFiles.length,
                    totalBytes: matchingFiles.reduce((s, x) => s + x.sizeBytes, 0),
                    files: matchingFiles
                });
            }
        }
        if (matchingSources.length > 0) {
            result.push({
                ...cat,
                fileCount: matchingSources.reduce((s, x) => s + x.fileCount, 0),
                totalBytes: matchingSources.reduce((s, x) => s + x.totalBytes, 0),
                sources: matchingSources
            });
        }
    }
    return result;
}

// Global actions
function handleArchiveSearch(val) {
    searchQuery = val;
    renderArchiveView();
}

function clearArchiveSearch() {
    searchQuery = "";
    renderArchiveView();
}

function toggleCategoryCollapse(catKey) {
    if (collapsedCategories.has(catKey)) {
        collapsedCategories.delete(catKey);
    } else {
        collapsedCategories.add(catKey);
    }
    renderArchiveView();
}

function toggleFileSelection(fileId) {
    if (selectedFileIds.has(fileId)) {
        selectedFileIds.delete(fileId);
    } else {
        selectedFileIds.add(fileId);
    }
    renderArchiveView();
}

function toggleSelectAllFiles() {
    const allFiles = getAllFiles();
    if (selectedFileIds.size === allFiles.length) {
        selectedFileIds.clear();
    } else {
        allFiles.forEach(f => selectedFileIds.add(f.id));
    }
    renderArchiveView();
}

function selectSourceFiles(srcKey) {
    for (const cat of getArchiveDB()) {
        for (const src of cat.sources) {
            if (src.sourceKey === srcKey) {
                src.files.forEach(f => selectedFileIds.add(f.id));
            }
        }
    }
    renderArchiveView();
}

function getAllFiles() {
    const out = [];
    for (const cat of getArchiveDB()) {
        for (const src of cat.sources) {
            out.push(...src.files);
        }
    }
    return out;
}

function downloadSingleFile(fileId) {
    const file = getAllFiles().find(f => f.id === fileId);
    if (!file) return;

    // 공식 파일 다운로드 링크 트리거 (로컬 docs/지침서_공식_아카이브/ 상대 경로)
    const downloadPath = `docs/지침서_공식_아카이브/${file.relPath}`;
    const a = document.createElement('a');
    a.href = downloadPath;
    a.download = file.filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function downloadSelectedFiles() {
    if (selectedFileIds.size === 0) {
        alert("다운로드할 파일을 1개 이상 선택해 주세요.");
        return;
    }

    const files = getAllFiles().filter(f => selectedFileIds.has(f.id));
    if (files.length === 1) {
        downloadSingleFile(files[0].id);
        return;
    }

    // 여러 개 선택 시 순차 다운로드 안내
    if (confirm(`선택하신 ${files.length}개의 지침서 파일을 순차적으로 다운로드하시겠습니까?`)) {
        files.forEach((f, idx) => {
            setTimeout(() => {
                downloadSingleFile(f.id);
            }, idx * 400);
        });
    }
}

function openGoogleDriveModal() {
    const modal = document.getElementById('gdrive-download-modal');
    if (modal) modal.classList.remove('hidden');
}

function closeGoogleDriveModal() {
    const modal = document.getElementById('gdrive-download-modal');
    if (modal) modal.classList.add('hidden');
}

function saveCustomDriveUrl() {
    const input = document.getElementById('custom-gdrive-input');
    if (input && input.value) {
        localStorage.setItem('CUSTOM_GOOGLE_DRIVE_URL', input.value.trim());
        alert("구글 드라이브 링크가 성공적으로 저장되었습니다!");
        renderArchiveView();
    }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Global window mappings
if (typeof window !== 'undefined') {
    window.initArchiveView = initArchiveView;
    window.renderArchiveView = renderArchiveView;
    window.handleArchiveSearch = handleArchiveSearch;
    window.clearArchiveSearch = clearArchiveSearch;
    window.toggleCategoryCollapse = toggleCategoryCollapse;
    window.toggleFileSelection = toggleFileSelection;
    window.toggleSelectAllFiles = toggleSelectAllFiles;
    window.selectSourceFiles = selectSourceFiles;
    window.getAllArchiveFiles = getAllFiles;
    window.downloadSingleFile = downloadSingleFile;
    window.downloadSelectedFiles = downloadSelectedFiles;
    window.openGoogleDriveModal = openGoogleDriveModal;
    window.closeGoogleDriveModal = closeGoogleDriveModal;
    window.saveCustomDriveUrl = saveCustomDriveUrl;
}



        // 탭 전환 라우팅 함수
        function switchStitchTab(tab) {
            const hSec = document.getElementById('view-hierarchy');
            const aSec = document.getElementById('view-archive');
            const hBtn = document.getElementById('tab-btn-hierarchy');
            const aBtn = document.getElementById('tab-btn-archive');

            if (tab === 'hierarchy') {
                hSec.classList.remove('hidden');
                aSec.classList.add('hidden');
                hBtn.className = 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition flex items-center gap-1.5 cursor-pointer bg-white text-emerald-700 shadow-xs border border-slate-200/60';
                aBtn.className = 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 cursor-pointer text-slate-600 hover:text-slate-900';
                if (typeof window.renderHierarchyView === 'function') {
                    window.renderHierarchyView();
                }
            } else {
                aSec.classList.remove('hidden');
                hSec.classList.add('hidden');
                aBtn.className = 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition flex items-center gap-1.5 cursor-pointer bg-white text-blue-700 shadow-xs border border-slate-200/60';
                hBtn.className = 'px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 cursor-pointer text-slate-600 hover:text-slate-900';
                if (typeof window.renderArchiveView === 'function') {
                    window.renderArchiveView();
                }
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 글로벌 바로가기 연동 (위계도감 -> 아카이브 점프)
        window.goToArchiveSearch = function(filename) {
            switchStitchTab('archive');
            setTimeout(() => {
                const input = document.getElementById('archive-search-input');
                if (input && typeof window.handleArchiveSearch === 'function') {
                    input.value = filename;
                    window.handleArchiveSearch(filename);
                }
            }, 100);
        };

        // 초기 구동
        document.addEventListener('DOMContentLoaded', () => {
            switchStitchTab('hierarchy');
        });
