name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Daily Welfare DB 06:00 Auto Crawler & Sync"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Stage clean static site bundle (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html stitch_portal_viewer.html _site/
          cp -a src _site/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
          include-hidden-files: 'true'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
